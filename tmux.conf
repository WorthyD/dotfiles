# ~/.tmux.conf (linked from dotfiles by makesymlinks.sh)

# Mouse: click to focus a pane, drag borders to resize, scroll to see history
set -g mouse on

# Alt+arrow switches panes without the Ctrl+b prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# More scrollback, true color, no delay after Esc (vim)
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -sg escape-time 10

# Prefix+r reloads this file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
